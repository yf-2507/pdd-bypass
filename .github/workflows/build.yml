name: Build pdd_bypass kernel module

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module code
        uses: actions/checkout@v4

      - name: Clone Xiaomi kernel source
        run: |
          git clone --depth=1 --branch alioth-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel_src

      - name: Convert Python 2 scripts to Python 3
        run: |
          python3 -m lib2to3 -w kernel_src/scripts/ 2>/dev/null || true
          find kernel_src/scripts -name "*.py" -exec sed -i 's/except \([A-Za-z]*\), \([a-z]*\):/except \1 as \2:/g' {} \;

      - name: Copy config + disable modversions
        run: |
          cp config kernel_src/.config
          sed -i "s/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/" kernel_src/.config

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "NDK=$PWD/android-ndk-r21e" >> $GITHUB_ENV

      - name: Prepare kernel + build module
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd kernel_src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- olddefconfig 2>&1 || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- prepare 2>&1 || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- modules_prepare 2>&1 || true
          cd ..
          make -C kernel_src M=$PWD ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- modules 2>&1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdd_bypass
          path: pdd_bypass.ko
